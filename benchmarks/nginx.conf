# Minimal nginx config for the Phase 6 static-file benchmark comparison.
# Serves the exact same public/ directory our own server serves at
# /static/*, so the comparison is measuring server overhead, not different
# file content.
#
# Run with: nginx -c $(pwd)/benchmarks/nginx.conf -p $(pwd)

worker_processes 1;
daemon off;
pid /tmp/nginx_benchmark.pid;
error_log /tmp/nginx_benchmark_error.log;

events {
    worker_connections 1024;
}

http {
    access_log off;
    server {
        listen 127.0.0.1:8070;
        location / {
            root public;
        }
    }
}
